[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s1-sar-pipeline"
version = "0.1.0"
description = "Sentinel-1 GRD/SLC RTC 전처리와 궤도별 Otsu 수체 판별 파이프라인"
requires-python = ">=3.10"
# 런타임 의존은 conda 환경(env/)으로 관리한다. SNAP(esa_snappy)은 pip으로
# 설치되지 않으므로 여기에 적지 않는다.
dependencies = []

[tool.setuptools.packages.find]
include = ["s1*"]

# 실행은 저장소 루트에서 모듈 경로로 한다:
#     python -m s1.tools.preprocess.batch_grd_rtc_frost --month 202607
# 개발 설치(어느 디렉터리에서든 import 가능)를 원하면:
#     pip install -e .
